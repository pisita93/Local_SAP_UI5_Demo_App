<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>E-Tax Invoice Portal · Greenspot</title>
<link rel="stylesheet" href="design/shared.css" />
<link rel="stylesheet" href="app.css" />
<style>
  /* preview pages: bilingual, A5-ish */
  .preview-page {
    width: 595px; min-height: 842px; background: #fff; color: #131E29;
    padding: 32px 36px; box-sizing: border-box; font-size: 11px; line-height: 1.5;
    box-shadow: 0 8px 32px rgba(0,0,0,.25); position: relative; overflow: hidden;
    font-family: 'Sarabun','72', system-ui, sans-serif;
  }
  .preview-page table { width: 100%; border-collapse: collapse; }
  .preview-page table th { font-weight: 700; font-size: 10px; padding: 6px 4px; text-align: left; border-bottom: 1px solid #131E29; background: #F5F6F7; }
  .preview-page table td { padding: 6px 4px; vertical-align: top; border-bottom: 1px dotted #BCC3CA; }
  .preview-page .num { text-align: right; font-variant-numeric: tabular-nums; }
  .preview-page .stamp { position: absolute; top: 80px; right: 36px; padding: 4px 10px; border: 2px solid; border-radius: 4px; font-weight: 800; font-size: 11px; letter-spacing: 0.05em; transform: rotate(-4deg); opacity: 0.85; }
  .preview-page .s1 { color: #0070F2; border-color: #0070F2; }
  .preview-page .s2 { color: #30914C; border-color: #30914C; }
  .preview-page .s3 { color: #7F8C9A; border-color: #7F8C9A; }
  .preview-page .s4 { color: #AA0808; border-color: #AA0808; }
  .preview-page .qrbox { width: 64px; height: 64px; background:
    linear-gradient(45deg, #131E29 25%, transparent 25%) 0 0/8px 8px,
    linear-gradient(-45deg, #131E29 25%, transparent 25%) 0 0/8px 8px,
    linear-gradient(45deg, transparent 75%, #131E29 75%) 0 0/8px 8px,
    linear-gradient(-45deg, transparent 75%, #131E29 75%) 0 0/8px 8px,
    #fff;
    border: 1px solid #131E29; }
  .preview-page .cert-stripe { background: #EDF6FF; border: 1px solid #0070F2; padding: 6px 8px; border-radius: 4px; display: flex; gap: 8px; align-items: center; font-size: 10px; }

  /* Activity log */
  .activity-log { display: flex; flex-direction: column; gap: 0; }
  .activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border2); }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon { width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  .activity-icon.success { background: var(--pos); }
  .activity-icon.info { background: var(--blue-h); }
  .activity-icon.error { background: var(--neg); }
  .activity-icon.pending { background: var(--warn); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .activity-detail { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .activity-time { font-size: 11px; color: var(--text3); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Info card (used in detail dialog) */
  .info-card { background: var(--bg); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 14px 16px; }
  .info-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); margin-bottom: 8px; }
  .muted { color: var(--text2); }
  .mono { font-family: '72Mono','Roboto Mono',ui-monospace,monospace; }
  .tabular { font-variant-numeric: tabular-nums; }
  .num { text-align: right; }

  /* Dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(34,53,72,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .dialog { background: var(--bg); border-radius: var(--r-md); box-shadow: 0 20px 80px rgba(34,53,72,.25), 0 0 0 1px rgba(34,53,72,.48); display: flex; flex-direction: column; max-height: 92vh; min-width: 480px; animation: slideUp 0.2s ease; }
  .dialog-xl { width: 1180px; max-width: 96vw; }
  .dialog-lg { width: 880px; }
  .dialog-md { width: 640px; }
  .dialog-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px 12px; border-bottom: 1px solid var(--border2); }
  .dialog-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .dialog-subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .dialog-body { padding: 20px; overflow-y: auto; flex: 1; min-height: 0; }
  .dialog-body.no-pad { padding: 0; }
  .dialog-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border2); background: var(--bg-shell); border-radius: 0 0 var(--r-md) var(--r-md); }

  /* Page header */
  .page-title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 8px; }
  .page-title { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.01em; }
  .page-title .th { font-size: 18px; font-weight: 400; color: var(--text2); }
  .page-subtitle { font-size: 13px; color: var(--text2); margin-top: 2px; }

  /* Filter bar */
  .filter-bar { background: var(--bg); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 12px 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group .field-label { font-size: 11px; font-weight: 600; color: var(--text2); }
  .filter-group .input, .filter-group select.input { min-width: 140px; }

  /* Tabs */
  .tab-strip { display: flex; gap: 4px; border-bottom: 1px solid var(--border2); padding: 0 4px; }
  .tab-strip .tab { padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .tab-strip .tab:hover { color: var(--text); }
  .tab-strip .tab.active { color: var(--blue-h); border-bottom-color: var(--blue-h); }
  .tab-strip .tab .count { background: var(--bg-shell); padding: 0 6px; height: 18px; border-radius: 9px; font-size: 11px; display: inline-flex; align-items: center; }
  .tab-strip .tab.active .count { background: #EDF6FF; color: var(--blue-h); }

  .settings-tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .settings-tab:hover { color: var(--text); }
  .settings-tab.active { color: var(--blue-h); border-bottom-color: var(--blue-h); }

  /* Pills */
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 22px; border-radius: 11px; font-size: 11px; font-weight: 600; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-success { background: rgba(48,145,76,.12); color: var(--pos); }
  .pill-warn { background: rgba(255,153,0,.14); color: #B26800; }
  .pill-error { background: rgba(170,8,8,.10); color: var(--neg); }
  .pill-info { background: #EDF6FF; color: var(--blue-h); }
  .pill-pending { background: rgba(255,153,0,.14); color: #B26800; }
  .pill-neutral { background: var(--bg-shell); color: var(--text2); }

  /* Worklist row hover */
  .row-clickable { cursor: pointer; }
  .row-clickable:hover { background: #FAFBFC; }
  .row-selected { background: #EDF6FF !important; }

  /* Copy summary */
  .copy-summary { background: linear-gradient(180deg, #FAFBFC 0%, var(--bg) 100%); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 14px 16px; }
  .copy-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border2); font-size: 13px; }
  .copy-row:last-child { border-bottom: none; }
  .copy-row.total { padding-top: 12px; font-weight: 700; font-size: 15px; }
  .copy-icon { width: 26px; height: 26px; border-radius: 6px; background: #EDF6FF; color: var(--blue-h); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Empty/helper */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text2); }

  /* Print sheet container */
  .print-deck { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; }

  /* Switch */
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-slider { position: absolute; cursor: pointer; inset: 0; background-color: #BCC3CA; transition: .15s; border-radius: 10px; }
  .switch-slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; top: 3px; background-color: white; transition: .15s; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .switch-slider { background-color: var(--blue); }
  .switch input:checked + .switch-slider:before { transform: translateX(16px); }

  /* Sortable table header */
  .sap-table th.sortable { cursor: pointer; user-select: none; }
  .sap-table th.sortable:hover { color: var(--blue-h); }
</style>
</head>
<body>
<div id="root"></div>

<!-- Tweak defaults persisted by host -->
<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "cozy"
}/*EDITMODE-END*/;
</script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Sarabun for Thai -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<script src="data.js"></script>

<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/shell.jsx"></script>
<script type="text/babel" src="components/preview.jsx"></script>
<script type="text/babel" src="components/worklist.jsx"></script>
<script type="text/babel" src="components/billing.jsx"></script>
<script type="text/babel" src="components/detail.jsx"></script>
<script type="text/babel" src="components/maintenance.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo } = React;

function App() {
  const [navCollapsed, setNavCollapsed] = useState(false);
  const [page, setPage] = useState("worklist");
  const [deliveries, setDeliveries] = useState(window.MOCK_DATA.deliveries);
  const [customers, setCustomers] = useState(window.MOCK_DATA.customers);
  const [shipTos, setShipTos] = useState(window.MOCK_DATA.shipTos);
  const [billingDialog, setBillingDialog] = useState(null);
  const [detailDialog, setDetailDialog] = useState(null);

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.body.classList.toggle("density-compact", tweaks.density === "compact");
  }, [tweaks.density]);

  const counts = useMemo(() => ({
    worklist: deliveries.filter(d => d.status === "ready" || d.status === "draft").length,
    history:  deliveries.filter(d => d.billingDoc).length,
    inet:     deliveries.filter(d => d.inetStatus === "submitted" || d.inetStatus === "rejected").length,
  }), [deliveries]);

  const handleCreateBilling = (selectedDeliveries) => setBillingDialog(selectedDeliveries);

  const handleBillingComplete = (billed, outcome = "success") => {
    setDeliveries(prev => prev.map(d => {
      const match = (billed || []).find(b => b.id === d.id);
      if (!match) return d;
      const num = "9100" + String(73000 + d.id.charCodeAt(d.id.length - 1) + Math.floor(Math.random() * 99)).slice(-5);
      if (outcome === "failure") {
        return { ...d, status: "error", billingDoc: num, inetStatus: "rejected", printCount: 0 };
      }
      return { ...d, status: "sent", billingDoc: num, inetStatus: "certified", printCount: 1 };
    }));
    setBillingDialog(null);
  };

  const handleSoldToUpdate = (soldTo, patch) => {
    setCustomers(prev => prev.map(c => c.soldTo === soldTo ? { ...c, ...patch } : c));
    // also update deliveries for any in-flight ones (so worklist preview reflects)
    setDeliveries(prev => prev.map(d => d.soldTo === soldTo ? { ...d, soldToMasterCopies: patch.masterCopies ?? d.soldToMasterCopies, soldToRequiresPo: patch.requiresPo ?? d.soldToRequiresPo } : d));
  };

  const handleShipToUpdate = (shipTo, patch) => {
    setShipTos(prev => prev.map(s => s.shipTo === shipTo ? { ...s, ...patch } : s));
    setDeliveries(prev => prev.map(d => d.shipTo === shipTo ? { ...d, shipToRequiresDeliveryNote: patch.requiresDeliveryNote ?? d.shipToRequiresDeliveryNote } : d));
  };

  return (
    <>
      <ShellBar onToggleNav={() => setNavCollapsed(c => !c)} />
      <div className="app-layout">
        <SideNav collapsed={navCollapsed} page={page} onNav={setPage} counts={counts} />
        <div className="main-content">
          {page === "worklist" && (
            <WorklistPage
              deliveries={deliveries}
              onCreateBilling={handleCreateBilling}
              onOpenDetail={(d) => setDetailDialog(d)}
            />
          )}
          {page === "history" && <HistoryPage deliveries={deliveries} />}
          {page === "inet" && <InetPage />}
          {page === "soldto" && <SoldToPage customers={customers} onUpdate={handleSoldToUpdate} />}
          {page === "shipto" && <ShipToPage shipTos={shipTos} customers={customers} onUpdate={handleShipToUpdate} />}
        </div>
      </div>

      {billingDialog && (
        <CreateBillingDialog
          deliveries={billingDialog}
          onClose={() => setBillingDialog(null)}
          onComplete={handleBillingComplete}
        />
      )}
      {detailDialog && (
        <DetailDialog
          delivery={detailDialog}
          onClose={() => setDetailDialog(null)}
          onCreate={(d) => { setDetailDialog(null); handleCreateBilling(d); }}
        />
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Display">
          <TweakRadio
            label="Density"
            value={tweaks.density}
            options={[{ value: "cozy", label: "Cozy" }, { value: "compact", label: "Compact" }]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
