/* ─── Toast ──────────────────────────────────────────────────── */
let _toast;
const Toast = () => {
  const [t, setT] = useState({ show: false, msg: '', type: 'info' });
  _toast = (msg, type = 'info') => {
    setT({ show: true, msg, type });
    setTimeout(() => setT(p => ({ ...p, show: false })), 3000);
  };
  return (
    <div className={`toast toast-${t.type} ${t.show ? 'show' : ''}`}>
      {t.type === 'success' ? <IcCheck size={14} /> : t.type === 'error' ? <IcX size={14} /> : <IcAlert size={14} />}
      {t.msg}
    </div>
  );
};
const showToast = (msg, type = 'info') => _toast && _toast(msg, type);

/* Format helper for credit limit by currency */
const formatMoney = (amount, currency) => {
  if (amount == null) return '—';
  const n = Number(amount);
  if (!isFinite(n)) return String(amount);
  const formatted = n.toLocaleString('en-US');
  if (currency === 'EUR') return '€' + formatted;
  if (currency === 'USD') return '$' + formatted;
  if (currency === 'GBP') return '£' + formatted;
  if (currency === 'THB') return '฿' + formatted;
  return formatted + ' ' + (currency || '');
};

const SLOT_STATUS_CLS = { 'Pending': 'tag-pending', 'Confirmed': 'tag-approved', 'Rejected': 'tag-error', 'Cancelled': 'tag-neutral' };

const ProcurementSlots = ({ setView }) => {
  const { useState: useLS } = React;
  const [slots, setSlots] = useLS([...SLOT_DATA]);
  const [filter, setFilter] = useLS('all');
  const [showAdd, setShowAdd] = useLS(false);
  const [showEmail, setShowEmail] = useLS(null); // slot to send email for
  const [emailSent, setEmailSent] = useLS({}); // id -> true
  const [showDetail, setShowDetail] = useLS(null);
  const [newSlot, setNewSlot] = useLS({
    poId: '', supplier: '', suppEmail: '', reqDate: '', reqTime: '09:00',
    plant: '1000', storeLoc: 'WH01', pallets: '', weight: '', truckRef: '', notes: ''
  });
  const setNS = (k, v) => setNewSlot(p => ({ ...p, [k]: v }));

  const rows = filter === 'all' ? slots : slots.filter(s => s.status === filter);

  const handleConfirm = (id) => {
    setSlots(prev => prev.map(s => s.id === id ? { ...s, status: 'Confirmed' } : s));
    showToast('Slot confirmed — email notification queued', 'success');
  };
  const handleReject = (id) => {
    setSlots(prev => prev.map(s => s.id === id ? { ...s, status: 'Rejected' } : s));
    showToast('Slot rejected', 'error');
  };
  const handleSendEmail = (slot) => {
    setEmailSent(p => ({ ...p, [slot.id]: true }));
    setSlots(prev => prev.map(s => s.id === slot.id ? { ...s, notified: true } : s));
    setShowEmail(null);
    showToast(`Email sent to ${slot.suppEmail}`, 'success');
  };
  const handleAddSlot = () => {
    const id = 'DS-00' + (slots.length + 1);
    setSlots(prev => [...prev, { ...newSlot, id, status: 'Pending', notified: false }]);
    setShowAdd(false);
    setNewSlot({ poId: '', supplier: '', suppEmail: '', reqDate: '', reqTime: '09:00', plant: '1000', storeLoc: 'WH01', pallets: '', weight: '', truckRef: '', notes: '' });
    showToast('Delivery slot created and supplier notified', 'success');
  };

  const pendingCount = slots.filter(s => s.status === 'Pending').length;
  const unnotified = slots.filter(s => !s.notified && s.status === 'Confirmed').length;

  return (
    <div className="page-area">
      <Breadcrumb items={[{ label: 'Home', onClick: () => setView('overview') }, { label: 'Delivery Slot Management' }]} />
      <div className="page-title-row">
        <div>
          <div className="page-title">Delivery Slot Management</div>
          <div className="page-subtitle">Internal procurement — manage inbound delivery slots &amp; notify suppliers</div>
        </div>
        <div className="flex gap-8">
          <button className="btn btn-secondary btn-sm"><IcRefresh size={13} /> Refresh</button>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>
            <IcPlus size={13} /> Add Slot
          </button>
        </div>
      </div>

      {/* KPIs */}
      <div className="kpi-strip" style={{ gridTemplateColumns: 'repeat(4,1fr)' }}>
        <div className="kpi-card kpi-card-blue">
          <div className="kpi-icon" style={{ background: '#EDF6FF' }}><IcCalendar size={16} stroke="var(--sap-color-interactive)" /></div>
          <div className="kpi-val">{slots.length}</div>
          <div className="kpi-label">Total Slots</div>
        </div>
        <div className="kpi-card kpi-card-yellow">
          <div className="kpi-icon" style={{ background: '#FFF3B8' }}><IcAlert size={16} stroke="var(--sap-color-warning)" /></div>
          <div className="kpi-val">{pendingCount}</div>
          <div className="kpi-label">Awaiting Confirmation</div>

/* ─── ADMIN: AUTHORIZATION MANAGEMENT ───────────────────────── */
const AdminAuthorization = ({ setView }) => {
  const [users, setUsers] = useState([...USERS]);
  const [selectedUser, setSelectedUser] = useState(null);
  const [editGroups, setEditGroups] = useState([]);
  const [showAddUser, setShowAddUser] = useState(false);
  const [newUser, setNewUser] = useState({ name: '', email: '', role: 'Sales Rep', salesGroups: [] });
  const [q, setQ] = useState('');
  const setNU = (k, v) => setNewUser(p => ({ ...p, [k]: v }));

  const filtered = users.filter(u => !q || u.name.toLowerCase().includes(q.toLowerCase()) || u.email.toLowerCase().includes(q.toLowerCase()));

  const toggleGroup = (id, arr, setArr) => setArr(prev => prev.includes(id) ? prev.filter(g => g !== id) : [...prev, id]);

  const openEdit = (u) => { setSelectedUser(u); setEditGroups([...u.salesGroups]); };
  const saveEdit = () => {
    setUsers(prev => prev.map(u => u.id === selectedUser.id ? { ...u, salesGroups: editGroups } : u));
    showToast(`Authorization updated for ${selectedUser.name}`, 'success');
    setSelectedUser(null);
  };
  const toggleActive = (id) => {
    setUsers(prev => prev.map(u => u.id === id ? { ...u, active: !u.active } : u));
    const u = users.find(u => u.id === id);
    showToast(`${u.name} ${u.active ? 'deactivated' : 'activated'}`, u.active ? 'error' : 'success');
  };
  const addUser = () => {
    const id = 'U-00' + (users.length + 1);
    setUsers(prev => [...prev, { ...newUser, id, active: true, lastLogin: '—' }]);
    setShowAddUser(false);
    setNewUser({ name: '', email: '', role: 'Sales Rep', salesGroups: [] });
    showToast(`User ${newUser.name} created`, 'success');
  };

  const ROLE_CLS = { 'Admin': 'tag-error', 'Sales Manager': 'tag-credit', 'Sales Rep': 'tag-info' };

  return (

          const count = users.filter(u => u.salesGroups.includes(sg.id) && u.active).length;

            <div key={sg.id} className="card">

                <div style={{ fontSize: 12, color: 'var(--sap-color-text-2)', marginBottom: 8 }}>Manager: {sg.manager}</div>

                <td><span className={`tag ${ROLE_CLS[u.role] || 'tag-neutral'}`}>{u.role}</span></td>
                <td>
                  <div className="flex gap-4" style={{ flexWrap: 'wrap' }}>
                    {u.salesGroups.length > 0
                      ? u.salesGroups.map(sg => <span key={sg} className="tag tag-neutral">{sg}</span>)
                      : <span className="text-2 fs-12">None</span>}
                  </div>
                </td>
                <td className="fs-12 text-2">{u.lastLogin}</td>
                <td>
                  <span className={`tag ${u.active ? 'tag-approved' : 'tag-error'}`}>{u.active ? 'Active' : 'Inactive'}</span>
                </td>
                <td onClick={e => e.stopPropagation()}>
                  <div className="flex gap-4">
                    <button className="btn btn-ghost btn-sm" onClick={() => openEdit(u)} title="Edit access"><IcEdit size={13} /></button>
                    <button className={`btn btn-sm ${u.active ? 'btn-reject' : 'btn-accept'}`}
                      onClick={() => toggleActive(u.id)}
                      title={u.active ? 'Deactivate' : 'Activate'}>
                      {u.active ? <IcX size={12} /> : <IcCheck size={12} />}
                    </button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Edit User Dialog */}
      {selectedUser && (
        <Dialog title={`Edit Access — ${selectedUser.name}`} onClose={() => setSelectedUser(null)}
          footer={<>
            <button className="btn btn-secondary" onClick={() => setSelectedUser(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={saveEdit}><IcCheck size={13} /> Save Changes</button>
          </>}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px 20px', marginBottom: 16 }}>
            <div className="field"><div className="field-label">Name</div><input className="input" readOnly value={selectedUser.name} /></div>
            <div className="field"><div className="field-label">Email</div><input className="input" readOnly value={selectedUser.email} /></div>
            <div className="field"><div className="field-label">Role</div>
              <select className="input" defaultValue={selectedUser.role}>
                <option>Sales Rep</option><option>Sales Manager</option><option>Admin</option>
              </select>
            </div>
            <div className="field"><div className="field-label">Status</div>
              <div style={{ display:'flex', alignItems:'center', height:36 }}>
                <span className={`tag ${selectedUser.active ? 'tag-approved' : 'tag-error'}`}>{selectedUser.active ? 'Active' : 'Inactive'}</span>
              </div>
            </div>
          </div>
          <div className="field">
            <div className="field-label" style={{ marginBottom: 10 }}>Sales Group Access <span style={{ fontWeight: 400, color: 'var(--sap-color-text-2)' }}>(select all that apply)</span></div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {SALES_GROUPS.map(sg => {
                const checked = editGroups.includes(sg.id);
                return (
                  <div key={sg.id}
                    onClick={() => toggleGroup(sg.id, editGroups, setEditGroups)}
                    style={{ padding: '12px 16px', border: `2px solid ${checked ? 'var(--sap-color-interactive)' : 'var(--sap-color-border-2)'}`, borderRadius: 8, cursor: 'pointer', background: checked ? '#EDF6FF' : '#fff', transition: 'all 0.12s' }}>
                    <div className="flex items-center justify-between">
                      <span style={{ fontWeight: 700, fontSize: 13 }}>{sg.id}</span>
                      {checked && <IcCheck size={14} stroke="var(--sap-color-interactive)" />}
                    </div>
                    <div style={{ fontSize: 12, color: 'var(--sap-color-text-2)', marginTop: 2 }}>{sg.name}</div>
                    <div style={{ fontSize: 11, color: 'var(--sap-color-text-3)', marginTop: 1 }}>{sg.region} · {sg.currency}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </Dialog>
      )}

      {/* Add User Dialog */}
      {showAddUser && (
        <Dialog title="Add New User" onClose={() => setShowAddUser(false)}
          footer={<>
            <button className="btn btn-secondary" onClick={() => setShowAddUser(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={addUser}><IcPlus size={13} /> Create User</button>
          </>}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px 20px', marginBottom: 16 }}>
            <div className="field"><div className="field-label">Full Name <span style={{ color: 'var(--sap-color-negative)' }}>*</span></div>
              <input className="input" value={newUser.name} onChange={e => setNU('name', e.target.value)} placeholder="e.g. John Smith" /></div>
            <div className="field"><div className="field-label">Email <span style={{ color: 'var(--sap-color-negative)' }}>*</span></div>
              <input className="input" type="email" value={newUser.email} onChange={e => setNU('email', e.target.value)} placeholder="user@company.com" /></div>
            <div className="field" style={{ gridColumn: 'span 2' }}><div className="field-label">Role</div>
              <select className="input" value={newUser.role} onChange={e => setNU('role', e.target.value)}>
                <option>Sales Rep</option><option>Sales Manager</option><option>Admin</option>
              </select>
            </div>
          </div>
          <div className="field">
            <div className="field-label" style={{ marginBottom: 10 }}>Sales Group Access</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {SALES_GROUPS.map(sg => {
                const checked = newUser.salesGroups.includes(sg.id);
                return (
                  <div key={sg.id}
                    onClick={() => setNU('salesGroups', checked ? newUser.salesGroups.filter(g => g !== sg.id) : [...newUser.salesGroups, sg.id])}
                    style={{ padding: '12px 16px', border: `2px solid ${checked ? 'var(--sap-color-interactive)' : 'var(--sap-color-border-2)'}`, borderRadius: 8, cursor: 'pointer', background: checked ? '#EDF6FF' : '#fff', transition: 'all 0.12s' }}>
                    <div className="flex items-center justify-between">
                      <span style={{ fontWeight: 700, fontSize: 13 }}>{sg.id}</span>
                      {checked && <IcCheck size={14} stroke="var(--sap-color-interactive)" />}
                    </div>
                    <div style={{ fontSize: 12, color: 'var(--sap-color-text-2)', marginTop: 2 }}>{sg.name}</div>
                    <div style={{ fontSize: 11, color: 'var(--sap-color-text-3)', marginTop: 1 }}>{sg.region}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </Dialog>
      )}
    </div>
  );
};

/* ─── SHELL BAR ──────────────────────────────────────────────── */
const ShellBar = ({ navOpen, setNavOpen }) => (
  <div className="shell-bar">
    <div className="flex items-center" style={{ gap: 0 }}>
      <button className="shell-btn" onClick={() => setNavOpen(o => !o)}>
        <IcMenu size={18} />
      </button>
      <div className="shell-logo">
        <SapLogo />
        <div className="shell-divider" />
        <span className="shell-product">Partner Portal</span>
      </div>
    </div>
    <div className="flex items-center" style={{ gap: 4 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, height: 36, padding: '0 10px', border: '1px solid rgba(255,255,255,0.2)', borderRadius: 8, background: 'rgba(255,255,255,0.08)', width: 200 }}>
        <IcSearch size={14} stroke="rgba(255,255,255,0.6)" />
        <input placeholder="Search..." style={{ border: 'none', outline: 'none', background: 'transparent', color: '#fff', fontSize: 13, fontFamily: '72, Arial, sans-serif', flex: 1 }} />
      </div>
      <div className="notif-wrap">
        <button className="shell-btn"><IcBell size={18} /></button>
        <div className="notif-badge" />
      </div>
      <button className="shell-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div className="avatar" style={{ width: 32, height: 32 }}>JM</div>
    </div>
  </div>
);

/* ─── SIDE NAV ───────────────────────────────────────────────── */
const SideNav = ({ view, setView, navOpen }) => {
  const isActive = (...v) => v.includes(view);
  return (
    <nav className={`side-nav ${navOpen ? '' : 'collapsed'}`}>
      <div style={{ height: 8 }} />
      <div className={`nav-item ${isActive('overview') ? 'active' : ''}`} onClick={() => setView('overview')}>
        <IcHome size={18} /><span className="nav-label">Overview</span>
      </div>
      <div className="nav-section-title">Master Data</div>
      <div className={`nav-item ${isActive('customers','cust-detail','cust-create','cust-change') ? 'active' : ''}`} onClick={() => setView('customers')}>
        <IcUsers size={18} /><span className="nav-label">Customer Master Data</span>
      </div>
      <div className={`nav-item ${isActive('suppliers','supp-detail','supp-create','supp-change') ? 'active' : ''}`} onClick={() => setView('suppliers')}>
        <IcTruck size={18} /><span className="nav-label">Supplier Master Data</span>
      </div>
      <div className="nav-section-title">Customer Portal</div>
      <div className={`nav-item ${isActive('cust-so') ? 'active' : ''}`} onClick={() => setView('cust-so')}>
        <IcShoppingCart size={18} /><span className="nav-label">Sales Orders</span>
      </div>
      <div className={`nav-item ${isActive('cust-ar') ? 'active' : ''}`} onClick={() => setView('cust-ar')}>
        <IcDollar size={18} /><span className="nav-label">Outstanding Invoices</span>
      </div>
      <div className="nav-section-title">Procurement</div>
      <div className={`nav-item ${isActive('proc-slots') ? 'active' : ''}`} onClick={() => setView('proc-slots')}>
        <IcCalendar size={18} /><span className="nav-label">Delivery Slot Mgmt</span>
      </div>
      <div className="nav-section-title">Supplier Portal</div>
      <div className={`nav-item ${isActive('supp-po') ? 'active' : ''}`} onClick={() => setView('supp-po')}>
        <IcFileInv size={18} /><span className="nav-label">Open Purchase Orders</span>
      </div>
      <div className={`nav-item ${isActive('supp-ap') ? 'active' : ''}`} onClick={() => setView('supp-ap')}>
        <IcCalendar size={18} /><span className="nav-label">AP Invoices</span>
      </div>
      <div className="nav-section-title">Sales</div>
      <div className={`nav-item ${isActive('sales-billing') ? 'active' : ''}`} onClick={() => setView('sales-billing')}>
        <IcList size={18} /><span className="nav-label">Sales Billing Report</span>
      </div>
      <div className={`nav-item ${isActive('sales-cia') ? 'active' : ''}`} onClick={() => setView('sales-cia')}>
        <IcDollar size={18} /><span className="nav-label">Cash-in-Advance</span>
      </div>
      <div className="nav-section-title">Workflow</div>
      <div className={`nav-item ${isActive('inbox','cust-approval','supp-approval') ? 'active' : ''}`} onClick={() => setView('inbox')}>
        <IcInbox size={18} /><span className="nav-label">Approval Inbox</span>
        {navOpen && <span className="badge" style={{ marginLeft: 'auto' }}>{APPROVALS.length}</span>}
      </div>
      <div className={`nav-item ${isActive('requests') ? 'active' : ''}`}>
        <IcList size={18} /><span className="nav-label">My Requests</span>
      </div>
      <div className="nav-section-title">Admin</div>
      <div className={`nav-item ${isActive('admin-auth') ? 'active' : ''}`} onClick={() => setView('admin-auth')}>
        <IcUsers size={18} /><span className="nav-label">Authorization</span>
      </div>
      <div className="nav-item">
        <IcClipboard size={18} /><span className="nav-label">Audit Log</span>
      </div>
    </nav>
  );
};

/* ─── APP ROOT ───────────────────────────────────────────────── */
const App = () => {
  const [navOpen, setNavOpen] = useState(true);
  const [viewState, setViewState] = useState({ view: 'overview', rec: null });
  const setView = (view, rec = null) => setViewState({ view, rec });
  const { view, rec } = viewState;

  const renderPage = () => {
    switch (view) {
      case 'overview':       return <OverviewPage setView={setView} />;
      case 'customers':      return <CustomerList setView={setView} />;
      case 'suppliers':      return <SupplierList setView={setView} />;
      case 'cust-detail':    return <CustomerDetail rec={rec} setView={setView} />;
      case 'supp-detail':    return <SupplierDetail rec={rec} setView={setView} />;
      case 'cust-create':    return <CustomerForm rec={null} mode="create" setView={setView} />;
      case 'cust-change':    return <CustomerForm rec={rec} mode="change" setView={setView} />;
      case 'supp-create':    return <SupplierForm rec={null} mode="create" setView={setView} />;
      case 'supp-change':    return <SupplierForm rec={rec} mode="change" setView={setView} />;
      case 'inbox':          return <ApprovalInbox setView={setView} />;
      case 'cust-approval':  return <ApprovalDetail rec={rec} type="customer" setView={setView} />;
      case 'supp-approval':  return <ApprovalDetail rec={rec} type="supplier" setView={setView} />;
      case 'cust-so':        return <CustomerSalesOrders setView={setView} />;
      case 'cust-ar':        return <CustomerAR setView={setView} />;
      case 'supp-po':        return <SupplierPO setView={setView} />;
      case 'supp-ap':        return <SupplierAP setView={setView} />;
      case 'proc-slots':     return <ProcurementSlots setView={setView} />;
      case 'sales-billing':   return <SalesBillingReport setView={setView} />;
      case 'sales-cia':       return <SalesCashInAdvance setView={setView} />;
      case 'admin-auth':      return <AdminAuthorization setView={setView} />;
      default:               return <OverviewPage setView={setView} />;
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>
      <ShellBar navOpen={navOpen} setNavOpen={setNavOpen} />
      <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
        <SideNav view={view} setView={setView} navOpen={navOpen} />
        <div style={{ flex: 1, overflowY: 'auto' }}>
          {renderPage()}
        </div>
      </div>
      <Toast />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
